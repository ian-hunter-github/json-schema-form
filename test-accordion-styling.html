<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion Styling Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .theme-selector { margin-bottom: 20px; }
        .theme-selector select { padding: 8px; font-size: 16px; }
        .accordion-demo { margin: 20px 0; }
        
        /* Basic accordion styles for demo */
        .jsf-accordion {
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        
        .jsf-accordion-header {
            display: flex;
            width: 100%;
            justify-content: flex-start;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: var(--accordion-header-bg, #f5f5f5);
            border: none;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .jsf-accordion-header:hover {
            background: var(--accordion-header-hover, #e5e5e5);
        }
        
        .jsf-accordion-title {
            font-weight: 600;
            color: #000;
        }
        
        .jsf-accordion-content {
            padding: 12px 14px;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <h1>Accordion Styling Test</h1>
    
    <div class="theme-selector">
        <label for="theme">Select Theme:</label>
        <select id="theme" onchange="changeTheme(this.value)">
            <option value="default">Default (Surface Variant)</option>
            <option value="professional">Professional (Blue-100)</option>
            <option value="formal">Formal (Purple-100)</option>
            <option value="fun">Fun (Yellow-100)</option>
            <option value="minimal">Minimal (Gray-200)</option>
            <option value="solar">Solar (Yellow-200)</option>
        </select>
    </div>
    
    <div class="accordion-demo">
        <h3>Accordion Demo</h3>
        <div class="jsf-accordion">
            <button class="jsf-accordion-header" aria-expanded="true">
                <span class="jsf-accordion-icon"></span>
                <span class="jsf-accordion-title">Person Details</span>
            </button>
            <div class="jsf-accordion-content">
                <p>This accordion contains personal information fields. The header background should contrast with the form content.</p>
                <p>Current background: <span id="current-bg">#f5f5f5 (default)</span></p>
            </div>
        </div>
        
        <div class="jsf-accordion">
            <button class="jsf-accordion-header" aria-expanded="false">
                <span class="jsf-accordion-icon"></span>
                <span class="jsf-accordion-title">Company Information</span>
            </button>
            <div class="jsf-accordion-content">
                <p>This accordion contains company information fields.</p>
            </div>
        </div>
    </div>
    
    <script>
        function changeTheme(theme) {
            const root = document.documentElement;
            let bgColor, hoverColor, themeName;
            
            switch(theme) {
                case 'professional':
                    bgColor = '#DBEAFE'; // blue-100
                    hoverColor = '#BFDBFE'; // blue-200
                    themeName = 'Professional (Blue-100)';
                    break;
                case 'formal':
                    bgColor = '#EDE9FE'; // purple-100
                    hoverColor = '#DDD6FE'; // purple-200
                    themeName = 'Formal (Purple-100)';
                    break;
                case 'fun':
                    bgColor = '#FEF3C7'; // yellow-100
                    hoverColor = '#FDE68A'; // yellow-200
                    themeName = 'Fun (Yellow-100)';
                    break;
                case 'minimal':
                    bgColor = '#EEEEEE'; // gray-200
                    hoverColor = '#E0E0E0'; // gray-300
                    themeName = 'Minimal (Gray-200)';
                    break;
                case 'solar':
                    bgColor = '#FFFFC0'; // yellow-200
                    hoverColor = '#FFFFA0'; // yellow-300
                    themeName = 'Solar (Yellow-200)';
                    break;
                default:
                    bgColor = '#f5f5f5'; // default
                    hoverColor = '#e5e5e5'; // default hover
                    themeName = 'Default (Surface Variant)';
            }
            
            root.style.setProperty('--accordion-header-bg', bgColor);
            root.style.setProperty('--accordion-header-hover', hoverColor);
            
            document.getElementById('current-bg').textContent = `${bgColor} (${themeName})`;
        }
    </script>
</body>
</html>
